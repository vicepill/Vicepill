<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAGITEK — Secret Boss</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: black; overflow: hidden; font-family: sans-serif;
  }

  #magitek-container {
    position: absolute; inset: 0; width: 100%; height: 100%; z-index: 10;
  }
  #scroller { width: 100%; height: 100%; overflow: hidden; }
  #scroller img { width: 100%; display: block; }
  #vignette {
    position: fixed; inset: 0; z-index: 15; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.92) 80%, rgba(0,0,0,1) 100%);
    opacity: 1; transition: opacity 0.08s linear;
  }
  
  #magitekButton {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20;
    background: transparent; border: none; outline: none; cursor: pointer; padding: 0;
  }
  #magitekButton svg {
    display: block; image-rendering: pixelated;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.6)) drop-shadow(0 0 18px rgba(255,255,255,0.25)) drop-shadow(0 0 40px rgba(180,180,255,0.15));
    transition: filter 0.15s;
  }
  #magitekButton:hover svg {
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.95)) drop-shadow(0 0 28px rgba(255,255,255,0.5)) drop-shadow(0 0 60px rgba(180,180,255,0.35));
  }
  #magitekButton::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: repeating-linear-gradient(to bottom, transparent 0px, transparent 3px, rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px);
  }

  @keyframes flicker {
    0%,100% { opacity: 1; } 92% { opacity: 1; } 93% { opacity: 0.4; } 94% { opacity: 1; } 97% { opacity: 1; } 98% { opacity: 0.2; } 99% { opacity: 1; }
  }
  @keyframes cursor-blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  #btn-label { animation: flicker 4s infinite; }
  #btn-cursor { animation: cursor-blink 0.9s infinite; }

  #infoButton {
    position: fixed; bottom: 24px; right: 24px; z-index: 20; background: transparent; border: none; outline: none; cursor: pointer; padding: 0;
  }
  #infoButton svg {
    display: block; image-rendering: pixelated;
    filter: drop-shadow(0 0 4px rgba(255,255,255,0.5)) drop-shadow(0 0 12px rgba(255,255,255,0.2)); transition: filter 0.15s;
  }
  #infoButton:hover svg { filter: drop-shadow(0 0 8px rgba(255,255,255,0.95)) drop-shadow(0 0 22px rgba(255,255,255,0.4)); }

  #infoPanel {
    display: none; position: fixed; inset: 0; z-index: 30; background: black;
    flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  }
  #infoPanel.open { display: flex; }
  #infoPanel p {
    font-family: 'Times New Roman', Times, serif; font-size: clamp(18px, 3vw, 28px); color: white;
    font-style: italic; letter-spacing: 0.04em; text-align: center; user-select: none;
  }
  #closeBtn {
    position: absolute; top: 20px; right: 24px; background: transparent; border: none; outline: none;
    cursor: pointer; font-family: 'Times New Roman', Times, serif; font-size: 28px; color: white;
    line-height: 1; opacity: 0.7; transition: opacity 0.15s;
  }
  #closeBtn:hover { opacity: 1; }

  #secretBtn {
    background: transparent; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.2);
    font-family: 'Times New Roman', Times, serif; font-size: 24px; padding: 5px 20px; cursor: pointer;
    transition: all 0.3s ease; border-radius: 4px;
  }
  #secretBtn:hover { border-color: white; color: white; text-shadow: 0 0 10px white; box-shadow: 0 0 10px rgba(255,255,255,0.5); }

  :root {
    --gb-lightest: #9bbc0f; --gb-light: #8bac0f; --gb-dark: #306230; --gb-darkest: #0f380f;
    --btn-ab: #c44040; --btn-ab-sh: #8a1c1c;
    --body-color: #b0a090; --body-dark: #8a7a6a; --body-shadow: #6a5a4a; 
  }

  #game-container {
    display: none; width: 100%; height: 100%; position: absolute; inset: 0; z-index: 40;
    justify-content: center; align-items: center; background: #0a0a14;
    font-family: 'Press Start 2P', monospace;
  }
  #game-container::before { content:''; position:fixed; inset:0; background: radial-gradient(ellipse at 50% 0%, #1a0a2e 0%, #0a0a14 60%); z-index:-1; }
  #game-container::after { content:''; position:fixed; inset:0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px); pointer-events:none; z-index:9999; }

  .phone-shell {
    width: 360px; height: 740px; background: linear-gradient(160deg, #2a2a3e 0%, #1a1a2a 100%);
    border-radius: 44px; border: 2px solid #3a3a5e;
    box-shadow: 0 0 0 1px #0a0a1a, 0 30px 80px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05);
    display: flex; flex-direction: column; align-items: center; overflow: hidden; position: relative;
  }
  .phone-notch {
    width: 120px; height: 28px; background: #111; border-radius: 0 0 20px 20px;
    display: flex; align-items: center; justify-content: center; gap: 8px; flex-shrink: 0;
  }
  .phone-notch .camera { width:10px; height:10px; background:#1a1a2e; border-radius:50%; border:2px solid #333; }
  .phone-notch .speaker { width:40px; height:5px; background:#111; border-radius:3px; border:1px solid #333; }
  .phone-screen {
    flex:1; width:100%; display:flex; flex-direction:column; align-items:center;
    padding: 8px 12px 8px; overflow: hidden;
  }

  .console-device {
    width: 300px; background: linear-gradient(170deg, var(--body-color) 0%, #9a8a78 50%, var(--body-dark) 100%);
    border-radius: 18px 18px 60px 60px;
    box-shadow: 0 4px 0 var(--body-shadow), 0 8px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
    display:flex; flex-direction:column; align-items:center; padding: 12px 16px 20px; position:relative; flex-shrink:0;
  }
  .console-label { font-size: 5px; color: var(--body-shadow); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 6px; }
  .power-led {
    position:absolute; top:16px; right:20px; width:6px; height:6px; background:#00ff44; border-radius:50%;
    box-shadow: 0 0 6px #00ff44, 0 0 12px #00ff44; animation: led-pulse 2s infinite;
  }
  @keyframes led-pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .screen-bezel {
    width: 232px; background: #1a1a1a; border-radius: 8px; padding: 12px;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.8), 0 2px 4px rgba(0,0,0,0.5); position:relative; margin-bottom:8px;
  }
  .screen-bezel::before {
    content:'ONE WINGED ANGEL EDITION'; position:absolute; top:4px; left:50%; transform:translateX(-50%);
    font-family:'Press Start 2P',monospace; font-size:3.5px; color:#444; letter-spacing:1px; white-space:nowrap;
  }
  .screen-inner {
    width:208px; height:208px; background:var(--gb-lightest); border:3px solid var(--gb-darkest);
    position:relative; overflow:hidden; image-rendering:pixelated;
    box-shadow: inset 0 0 20px rgba(0,56,0,0.3), inset 0 0 4px rgba(0,0,0,0.4);
  }
  .screen-inner::after {
    content:''; position:absolute; inset:0;
    background-image: linear-gradient(rgba(0,0,0,0.03) 1px,transparent 1px), linear-gradient(90deg,rgba(0,0,0,0.03) 1px,transparent 1px);
    background-size:2px 2px; pointer-events:none; z-index:10;
  }
  #gameCanvas { width:202px; height:202px; display:block; image-rendering:pixelated; }

  .console-side-deco { display:flex; justify-content:space-between; width:100%; margin-bottom:4px; }
  .vol-label { font-family:'VT323',monospace; font-size:10px; color:var(--body-shadow); }

  .controls-row { display:flex; justify-content:space-between; align-items:center; width:100%; margin-top:4px; gap:8px; }
  .dpad { width:90px; height:90px; position:relative; flex-shrink:0; }
  .dpad-center {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:30px; height:30px;
    background:linear-gradient(135deg,#555,#333); border-radius:50%; z-index:2;
  }
  .dpad-arm {
    position:absolute; background:linear-gradient(160deg,#555,#333); border-radius:3px; cursor:pointer; user-select:none;
    box-shadow:0 3px 0 #1a1a1a,0 4px 6px rgba(0,0,0,0.4); display:flex; align-items:center; justify-content:center;
    font-size:8px; color:#888; transition:transform 0.05s,box-shadow 0.05s;
  }
  .dpad-arm:active,.dpad-arm.pressed { background:linear-gradient(160deg,#444,#222); transform:translateY(1px)!important; box-shadow:0 1px 0 #1a1a1a!important; }
  .dpad-up    { width:30px;height:30px;top:0;left:30px;border-radius:4px 4px 2px 2px; }
  .dpad-down  { width:30px;height:30px;bottom:0;left:30px;border-radius:2px 2px 4px 4px; }
  .dpad-left  { width:30px;height:30px;top:30px;left:0;border-radius:4px 2px 2px 4px; }
  .dpad-right { width:30px;height:30px;top:30px;right:0;border-radius:2px 4px 4px 2px; }
  .dpad-up::after{content:'▲'} .dpad-down::after{content:'▼'} .dpad-left::after{content:'◀'} .dpad-right::after{content:'▶'}

  .btn-cluster { width:90px; height:90px; position:relative; flex-shrink:0; }
  .btn-action {
    position:absolute; width:28px; height:28px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#d45050,var(--btn-ab));
    box-shadow:0 4px 0 var(--btn-ab-sh),0 5px 10px rgba(0,0,0,0.4);
    cursor:pointer; user-select:none; display:flex; align-items:center; justify-content:center;
    font-family:'Press Start 2P',monospace; font-size:7px; color:rgba(255,255,255,0.9);
    text-shadow:0 1px 2px rgba(0,0,0,0.5); transition:transform 0.05s,box-shadow 0.05s; border:none; outline:none;
  }
  .btn-action:active,.btn-action.pressed { transform:translateY(3px)!important; box-shadow:0 1px 0 var(--btn-ab-sh),0 2px 4px rgba(0,0,0,0.4)!important; }
  .btn-y{top:0;left:31px} .btn-x{top:31px;left:0} .btn-a{top:31px;right:0} .btn-b{bottom:0;left:31px}

  .select-start-row { display:flex; gap:16px; margin-margin-top:8px; }
  .btn-pill {
    width:50px; height:14px; border-radius:7px; background:linear-gradient(180deg,#555,#333);
    box-shadow:0 3px 0 #1a1a1a,0 4px 6px rgba(0,0,0,0.4); cursor:pointer; user-select:none;
    display:flex; align-items:center; justify-content:center; font-family:'Press Start 2P',monospace; font-size:4px; color:#888;
    transition:transform 0.05s,box-shadow 0.05s; transform:rotate(-10deg);
  }
  .btn-pill:active,.btn-pill.pressed { transform:rotate(-10deg) translateY(2px); box-shadow:0 1px 0 #1a1a1a; }
  .speaker-grille { display:flex; gap:3px; margin-top:6px; }
  .speaker-dot { width:3px; height:3px; background:var(--body-shadow); border-radius:50%; opacity:0.6; }
</style>
</head>
<body>

  <div id="magitek-container">

    <div id="vignette"></div>

    <button id="magitekButton" aria-label="MAGITEK">

          <text x="120" y="46" text-anchor="middle" dominant-baseline="middle" font-family="'Courier New', monospace" font-size="18" letter-spacing="8" fill="#ffffff" font-weight="bold">MAGITEK</text>

        <rect x="0"  y="8"  width="4"  height="24"/><rect x="36" y="8"  width="4"  height="24"/>
        <rect x="4"  y="4"  width="4"  height="4"/><rect x="32" y="4"  width="4"  height="4"/>

      </g>
      <g fill="#444444">

      </g>
      <text x="20" y="22" text-anchor="middle" dominant-baseline="middle" font-family="'Times New Roman', serif" font-size="18" fill="#ffffff" font-style="italic">i</text>

  <div id="infoPanel">
    <button id="closeBtn">&#x2715;</button>
    <p>da mihi mortem iterum</p>
    <button id="secretBtn">?</button>

  <div id="game-container">
    <div class="phone-shell">
      <div class="phone-notch">
        <div class="camera"></div>
        <div class="speaker"></div>
      </div>
      <div class="phone-screen">
        <div class="console-device">
          <div class="console-label">RetroPocket — One Winged Angel</div>
          <div class="power-led"></div>
          <div class="screen-bezel">
            <div class="screen-inner">
              <canvas id="gameCanvas" width="202" height="202"></canvas>
            </div>
          </div>

            <span class="vol-label">◁ VOL ▷</span>
            <span class="vol-label">CONTRAST</span>
          </div>

              <div class="dpad-arm dpad-up" id="btn-up"></div>

  <script>
    const audioMagitek = document.getElementById("audioMagitek");
    const audioBoss    = document.getElementById("audioBoss");
    const magitekBtn   = document.getElementById("magitekButton");
    const scroller     = document.getElementById("scroller");
    const infoBtn      = document.getElementById("infoButton");
    const infoPanel    = document.getElementById("infoPanel");
    const closeBtn     = document.getElementById("closeBtn");
    const vignette     = document.getElementById("vignette");
    const secretBtn    = document.getElementById("secretBtn");
    const TOTAL = 18 * 60;
    const SLOW_END = 10 * 60 + 50;
    const FAST_END = TOTAL;
    scroller.scrollTop = 0;

    // Difficulty Variables
    let diffLevel = 1; 
    let diffSelection = 1;
    const DIFF_NAMES = ['EASY', 'NORMAL', 'HARD', 'EXTREME'];
    let diffT = 0;
    let diffMults = { hp: 1, dmg: 1, spd: 1 };
    let BOSS_MAXHP = 350;
    let BOSS_MAXHP2 = 500;

    function updateVignette(t) {
      let opacity;
      if (t <= SLOW_END) {
        const slowProgress = t / SLOW_END;
        opacity = 1 - (slowProgress * 0.35);
      } else {
        const fastProgress = (t - SLOW_END) / (FAST_END - SLOW_END);
        const eased = 1 - Math.pow(1 - fastProgress, 2);
        opacity = 0.65 - (eased * 0.65);
      }
      vignette.style.opacity = Math.max(0, opacity);
    }

    magitekBtn.onclick = async () => {
      magitekBtn.style.display = "none";
      try { await audioMagitek.play(); } catch (e) { alert("Audio blocked by browser"); }
      const maxScroll = scroller.scrollHeight - scroller.clientHeight;
      scroller.scrollTop = maxScroll;
      audioMagitek.addEventListener("timeupdate", () => {
        if (!audioMagitek.duration) return;
        const t = audioMagitek.currentTime;
        const progress = t / audioMagitek.duration;
        scroller.scrollTop = maxScroll * (1 - progress);
        updateVignette(t);
      });
    };

    infoBtn.onclick  = () => infoPanel.classList.add("open");
    closeBtn.onclick = () => infoPanel.classList.remove("open");
    secretBtn.onclick = async () => {
      audioMagitek.pause();
      try { 
        audioBoss.volume = 0.6;
        await audioBoss.play();
      } catch (e) { console.log("Boss audio prevented by browser", e); }

      document.getElementById('magitek-container').style.display = 'none';
      document.getElementById('infoButton').style.display = 'none';
      infoPanel.classList.remove('open');
      
      document.getElementById('game-container').style.display = 'flex';
      startRetroGame();
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 202, H = 202;
    const C = { lightest: '#9bbc0f', light: '#8bac0f', dark: '#306230', darkest: '#0f380f' };
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function playSfx(freq, type, dur, vol=0.1) {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq*0.5, audioCtx.currentTime + dur);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    }

    const keys = {};
    const jp = {};
    function setupInput() {
      const map = [
        ['btn-up','up'],['btn-down','down'],['btn-left','left'],['btn-right','right'],
        ['btn-a','a'],['btn-b','b'],['btn-x','x'],['btn-y','y'],
        ['btn-select','select'],['btn-start','start'],
      ];
      map.forEach(([id,k]) => {
        const el = document.getElementById(id);
        el.addEventListener('pointerdown', e => { e.preventDefault(); keys[k]=true; jp[k]=true; el.classList.add('pressed'); });
        el.addEventListener('pointerup',   e => { e.preventDefault(); keys[k]=false; el.classList.remove('pressed'); });
        el.addEventListener('pointerleave',e => { keys[k]=false; el.classList.remove('pressed'); });
      });
      document.addEventListener('keydown', e => {
        const m = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right', w:'up', s:'down', a:'left', d:'right', z:'a', x:'b', c:'y', y:'y', ' ':'a', Enter:'start', Shift:'select'};

    function updateFight(dt) {
      t += dt; frameN++;
      boss.wingAngle = 0.3 + Math.sin(t*1.5)*0.15; boss.floatY = Math.sin(t*1.2)*4;
      if (boss.wingSpan < 1) boss.wingSpan = Math.min(1, boss.wingSpan+dt*0.8);
      
      if (!hero.dead) {
        const spd = hero.speed * (hero.limitBreak ? 1.5 : 1);
        if (keys.left  && hero.x > 12)   hero.x -= spd*dt;
        if (keys.right && hero.x < W-12) hero.x += spd*dt;
      }
      if (hero.attackCooldown > 0) hero.attackCooldown -= dt;
      if (hero.invincible) { hero.invTimer -= dt; if(hero.invTimer<=0) hero.invincible=false; }
      if (boss.invincible) { boss.invTimer -= dt; if(boss.invTimer<=0) boss.invincible=false; }

      if (hero.attacking) {
        hero.attackTimer -= dt;
        hero.slashTrail.forEach(s=>{s.a-=dt*4;}); hero.slashTrail=hero.slashTrail.filter(s=>s.a>0);
        if (hero.attackTimer<=0) { hero.attacking=false; hero.limitBreak=false; }
      }

      if (!hero.dead && !hero.attacking) {
        if (jp.a && hero.attackCooldown<=0) {
          hero.attacking=true;
          hero.attackTimer=0.3; hero.attackCooldown=0.4; hero.slashTrail=[];
          for (let i=0;i<5;i++) hero.slashTrail.push({x:boss.x-15+i*6,y:boss.y-10+i*3,w:12,h:3,a:0.8-i*0.12});
          
          if (!boss.invincible && Math.abs(hero.x-boss.x)<40 && hero.y-boss.y<120) {
            const dmg = hero.limitBreak ? 40 : 15 + Math.floor(Math.random()*10);
            boss.hp = Math.max(0, boss.hp-dmg); spawnParticles(boss.x,boss.y,dmg>15?8:4,C.lightest,80,0.4); flash(C.lightest,0.08); hero.limitGauge=Math.min(100,hero.limitGauge+5);
            playSfx(400, 'square', 0.1);
          } else {
            playSfx(800, 'sine', 0.05, 0.05);
          }
        }
        if (jp.b && hero.mp>=15) {
          hero.mp -= 15;
          hero.attackCooldown=0.6; const dmg = boss.invincible ? 0 : 30+Math.floor(Math.random()*10);
          boss.hp=Math.max(0,boss.hp-dmg); spawnParticles(boss.x,boss.y-10,12,C.dark,100,0.6); flash(C.light,0.1); hero.limitGauge=Math.min(100,hero.limitGauge+8);
          playSfx(600, 'sawtooth', 0.15);
        }
        if (jp.y && hero.limitGauge>=100 && !hero.limitBreak) {
          hero.limitBreak=true;
          hero.limitGauge=0; hero.attacking=true; hero.attackTimer=0.8; hero.attackCooldown=0; const dmg = 85+Math.floor(Math.random()*20);
          playSfx(800, 'square', 0.3, 0.2);
          if (!boss.invincible) {
            boss.hp=Math.max(0,boss.hp-dmg);
            spawnParticles(boss.x,boss.y,25,C.lightest,140,0.8); spawnParticles(boss.x,boss.y,15,C.darkest,80,0.6); flash(C.lightest,0.25);
          }
        }
      }
      if (hero.mp < hero.maxMp) hero.mp = Math.min(hero.maxMp, hero.mp+dt*3);
      
      if (boss.hp <= 0 && boss.phase===1) {
        boss.phase=2; boss.hp=BOSS_MAXHP2; boss.maxHp=BOSS_MAXHP2; boss.invincible=true; boss.invTimer=2.5; boss.state='idle';
        boss.actionTimer=2.5;
        flash(C.darkest,0.4); spawnParticles(boss.x,boss.y,30,C.dark,120,1.5); STATE='phase2';
        setTimeout(()=>{ if(STATE==='phase2') STATE='fight'; },2500); return;
      }
      if (boss.hp <= 0 && boss.phase===2 && !boss.dead) {
        boss.dead=true;
        spawnParticles(boss.x,boss.y,40,C.lightest,160,2.0); flash(C.lightest,0.5); 
        setTimeout(()=>{ STATE='cutscene'; cutsceneT=0; }, 2000);
        return;
      }

      if (!boss.dead && !boss.invincible) {
        boss.actionTimer -= dt;
        boss.stateTimer += dt;
        if (boss.state==='idle' && boss.actionTimer<=0) bossChooseAttack();
        if (boss.state==='slash') {
          if (boss.stateTimer < 0.4) { boss.x += (boss.slashX-boss.x)*5*dt; } 
          else {
            fr(boss.slashX-4, boss.y, 8, H-boss.y-18, C.darkest);
            ctx.globalAlpha=0.4;
            fr(boss.slashX-8,boss.y,16,H-boss.y-18,C.dark); ctx.globalAlpha=1;
            if (!hero.invincible && Math.abs(hero.x-boss.slashX)<12) { heroTakeDamage(boss.phase===2?14:9); }
            if (boss.stateTimer>0.8) { boss.state='idle'; boss.actionTimer=0.8; boss.masamuneActive=false; boss.x=W/2; }
          }
        }
        if (boss.state==='beam') {
          if (boss.stateTimer<0.5) { ctx.globalAlpha=boss.stateTimer/0.5*0.4; fr(boss.beamX-10,boss.y,20,H,C.lightest); ctx.globalAlpha=1; } 
          else {
            fr(boss.beamX-5,0,10,H,C.darkest);
            fr(boss.beamX-2,0,4,H,C.lightest);
            if (!hero.invincible && Math.abs(hero.x-boss.beamX)<8) heroTakeDamage(boss.phase===2?18:12);
            if (boss.stateTimer>1.2) { boss.state='idle'; boss.actionTimer=1.0; boss.beamActive=false; }
          }
        }
        if (boss.state==='masamune') {
          boss.masamuneAngle += dt*(boss.phase===2?6:4);
          ctx.save();
          ctx.translate(boss.x, boss.y); ctx.rotate(boss.masamuneAngle);
          fr(-2,-115,3,119,C.lightest); fr(-3,-115,5,4,C.dark); ctx.restore();
          
          const mTip = { x: boss.x+Math.sin(boss.masamuneAngle)*115, y: boss.y-Math.cos(boss.masamuneAngle)*115 };
          const mMid = { x: boss.x+Math.sin(boss.masamuneAngle)*57, y: boss.y-Math.cos(boss.masamuneAngle)*57 };
          
          const hitTip = Math.abs(hero.x-mTip.x)<16 && Math.abs(hero.y-mTip.y)<16;
          const hitMid = Math.abs(hero.x-mMid.x)<16 && Math.abs(hero.y-mMid.y)<16;
          
          if (!hero.invincible && (hitTip || hitMid)) heroTakeDamage(boss.phase===2?16:10);
          
          if (boss.stateTimer>2.0) { boss.state='idle'; boss.actionTimer=1.2; boss.masamuneActive=false; boss.masamuneAngle=0; }
        }
        if (boss.state==='meteor') {
          boss.meteorList=boss.meteorList.filter(m => {
            if (m.delay>0) { m.delay-=dt; return true; } m.y += m.speed*dt;
            const prog=Math.min(1,m.y/m.tx); ctx.globalAlpha=0.3+prog*0.3; fr(m.tx-m.size/2,H-22,m.size,3,C.darkest); ctx.globalAlpha=1;
            ctx.fillStyle=C.darkest; ctx.beginPath(); ctx.arc(m.x,m.y,m.size,0,Math.PI*2); ctx.fill();
            ctx.fillStyle=C.dark; ctx.beginPath(); ctx.arc(m.x-1,m.y-1,m.size-2,0,Math.PI*2); ctx.fill();
            ctx.fillStyle=C.light; ctx.globalAlpha=0.5; fr(m.x-1,m.y-m.size*2,2,m.size*2,C.lightest); ctx.globalAlpha=1;
            if (m.y > H-22) { spawnParticles(m.x,H-22,8,C.dark,70,0.5); if (!hero.invincible && Math.abs(hero.x-m.x)<14) heroTakeDamage(boss.phase===2?20:13); return false; } return true;
          });
          if (boss.meteorList.length===0 && boss.stateTimer>1.5) { boss.state='idle'; boss.actionTimer=1.0; }
        }
        if (boss.state==='supernova') {
          boss.novaTimer+=dt;
          const rings = Math.min(5, Math.floor(boss.novaTimer/0.3)+1);
          for (let r=0;r<rings;r++) {
            const radius=(r+1)*18+boss.novaTimer*20;
            ctx.strokeStyle=r%2===0?C.darkest:C.dark; ctx.lineWidth=3+r;
            ctx.globalAlpha=Math.max(0,1-boss.novaTimer/2); ctx.beginPath(); ctx.arc(boss.x,boss.y,radius,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1;
          }
          if (boss.novaTimer>0.8&&boss.novaTimer<1.6&&!hero.invincible) heroTakeDamage(25*dt);
          if (boss.novaTimer>2.0) { boss.state='idle'; boss.actionTimer=1.5; boss.novaActive=false; }
        }
        
        // NEW ATTACKS
        if (boss.state==='octaslash') {
            boss.masamuneActive = true;
            if (boss.stateTimer > boss.octaCount * 0.25 && boss.octaCount < 8) {
                boss.slashX = hero.x + (Math.random()-0.5)*40;
                boss.x = boss.slashX;
                boss.y = hero.y - 20 - Math.random()*20; 
                if (!hero.invincible && Math.abs(hero.x - boss.x) < 25) heroTakeDamage(boss.phase===2?15:10);
                spawnParticles(boss.x, boss.y, 5, C.light, 80, 0.2);
                boss.octaCount++;
                playSfx(400, 'square', 0.05);
            }
            if (boss.stateTimer > 2.5) { boss.state='idle'; boss.actionTimer=0.5; boss.masamuneActive=false; boss.x=W/2; boss.y=65; }
        }
        if (boss.state==='shadowflare') {
            boss.flareList = boss.flareList.filter(f => {
                f.x += (hero.x - f.x) * dt * 0.8;
                f.y += (hero.y - f.y) * dt * 0.8;
                ctx.fillStyle = C.darkest; ctx.beginPath(); ctx.arc(f.x, f.y, 8, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = C.lightest; ctx.beginPath(); ctx.arc(f.x, f.y, 4, 0, Math.PI*2); ctx.fill();
                if (!hero.invincible && Math.abs(hero.x-f.x)<10 && Math.abs(hero.y-f.y)<10) {
                    heroTakeDamage(25); return false;
                }
                f.life -= dt;
                return f.life > 0;
            });
            if (boss.stateTimer > 4.0) { boss.state='idle'; boss.actionTimer=0.5; }
        }
      }
      
      if (hero.hp<=0&&!hero.dead) { hero.dead=true; spawnParticles(hero.x,hero.y,15,C.dark,80,1.0); setTimeout(()=>{ STATE='gameover'; },1500); }

      drawBackground(); drawBoss(); drawHero(); updateParticles(dt); drawHUD(); drawBottomBar();
      if (flashTimer>0) { flashTimer-=dt; ctx.globalAlpha=Math.min(1,flashTimer/0.12)*0.6; fr(0,0,W,H,flashCol); ctx.globalAlpha=1; }
      if (STATE==='phase2') {
        fr(0,0,W,H,C.darkest); ctx.globalAlpha=0.8; const blink = Math.floor(t*4)%2===0;
        if (blink) { txtC('SEPHIROTH',70,8,C.lightest); txtC('ENRAGES!',90,7,C.light); txtC('ONE WINGED',115,6,C.dark); txtC('ANGEL',130,10,C.dark); } ctx.globalAlpha=1;
      }
    }

    function heroTakeDamage(dmg) {
      if (hero.invincible || hero.dead) return;
      dmg = Math.floor(dmg * diffMults.dmg);
      hero.hp = Math.max(0, hero.hp - dmg); hero.invincible=true; hero.invTimer=0.6;
      spawnParticles(hero.x,hero.y,6,C.darkest,60,0.4); flash(C.dark,0.1); hero.limitGauge=Math.min(100,hero.limitGauge+10);
      playSfx(150, 'sawtooth', 0.2, 0.15);
    }

    let titleT=0;
    function updateTitle(dt) {
      titleT+=dt; t+=dt; clr(C.darkest);
      for (let i=0;i<40;i++) { const sx=(i*67+13+Math.floor(titleT*8))%W; const sy=(i*43+7)%H;
      const blink=Math.sin(titleT*2+i)>0.3; fr(sx,sy,blink?2:1,1,i%4===0?C.lightest:C.dark); }
      fr(0,30,W,60,C.darkest); fr(2,32,W-4,56,C.dark); txtC('RETROPOCKET',42,6,C.light);
      txtC('ONE WINGED',57,8,C.lightest); txtC('ANGEL',70,10,C.lightest); fr(10,78,W-20,2,C.light);
      const bx=W/2, by=115; fr(bx-5,by-25,10,5,C.light);
      fr(bx-3,by-20,6,8,C.lightest); fr(bx-5,by-12,10,18,C.dark);
      for (let f=0;f<5;f++) { const fa=0.3+f*0.25+Math.sin(titleT*1.2)*0.1; const fl=16+f*5; ctx.save(); ctx.translate(bx+3,by-15);
      ctx.rotate(fa); fr(0,0,2,fl,f%2===0?C.darkest:C.dark); ctx.restore();
      }
      if (Math.floor(titleT*2)%2===0) { txtC('PRESS A TO START',155,5,C.lightest); }
      txtC('◁ D-PAD TO MOVE ▷',168,4,C.dark); txtC('A=ATTACK  B=MAGIC',180,4,C.dark); txtC('Y=LIMIT BREAK',192,4,C.dark);
      if (jp.a || jp.start) {
        playSfx(880, 'square', 0.1); 
        STATE='difficulty'; titleT=0; t=0; diffT=0; diffSelection=1;
      }
    }

    function updateDifficulty(dt) {
        diffT += dt; t += dt; clr(C.darkest);
        for (let i=0;i<40;i++) { const sx=(i*67+13+Math.floor(diffT*8))%W; const sy=(i*43+7)%H; const blink=Math.sin(diffT*2+i)>0.3; fr(sx,sy,blink?2:1,1,i%4===0?C.lightest:C.dark); }
        fr(0,30,W,140,C.darkest); fr(2,32,W-4,136,C.dark);
        txtC('SELECT DIFFICULTY', 50, 6, C.lightest);
        
        if (jp.up) { diffSelection = (diffSelection - 1 + 4) % 4; playSfx(600, 'square', 0.05); }
        if (jp.down) { diffSelection = (diffSelection + 1) % 4; playSfx(600, 'square', 0.05); }
        
        for(let i=0; i<4; i++) {
            const y = 80 + i*20;
            const isSel = i === diffSelection;
            txtC(DIFF_NAMES[i], y, 6, isSel ? C.lightest : C.darkest);
            if(isSel) {
                txt('▶', W/2 - 40, y, 6, C.lightest);
                txt('◀', W/2 + 32, y, 6, C.lightest);
            }
        }
        
        if (jp.a || jp.start) {
            playSfx(880, 'square', 0.1);
            diffLevel = diffSelection;
            
            if(diffLevel===0) { diffMults = { hp: 1.5, dmg: 0.5, spd: 0.7 }; BOSS_MAXHP=200; BOSS_MAXHP2=300; }
            if(diffLevel===1) { diffMults = { hp: 1.0, dmg: 1.0, spd: 1.0 }; BOSS_MAXHP=350; BOSS_MAXHP2=500; }
            if(diffLevel===2) { diffMults = { hp: 0.8, dmg: 1.5, spd: 1.3 }; BOSS_MAXHP=500; BOSS_MAXHP2=700; }
            if(diffLevel===3) { diffMults = { hp: 0.5, dmg: 2.0, spd: 1.8 }; BOSS_MAXHP=700; BOSS_MAXHP2=999; }
            
            STATE='intro'; titleT=0; t=0; hero.x=W/2; hero.y=H-28;
            hero.maxHp = Math.floor(150 * diffMults.hp);
            hero.hp = hero.maxHp;
            hero.mp = 100; hero.attacking = false;
            hero.invincible=false; hero.dead=false; hero.limitGauge=0; hero.limitBreak=false;
            boss.hp=BOSS_MAXHP; boss.maxHp=BOSS_MAXHP; boss.phase=1; boss.state='idle'; boss.actionTimer=2.0; boss.dead=false; boss.wingSpan=0; boss.masamuneActive=false; boss.beamActive=false;
            boss.meteorList=[]; boss.flareList=[]; boss.novaActive=false; boss.invincible=false; boss.x=W/2; boss.y=65;
            boss.floatY=0; particles=[]; flashTimer=0; cutsceneT=0; boss.octaCount = 0;
        }
    }

    let introT=0;
    const introCrawl=['2000 YEARS AGO,','HE FELL FROM','THE SKY...','','NOW SEPHIROTH','RISES AGAIN','IN THE NORTHERN','CRATER.','','YOU MUST','STOP HIM.'];
    function updateIntro(dt) {
      introT+=dt; t+=dt; fr(0,0,W,H,C.darkest);
      for (let i=0;i<20;i++) { const sx=(i*77)%W; const sy=((i*47+Math.floor(introT*20))%H+H)%H; fr(sx,sy,1,1,C.dark); }
      const lineH=14; 
      const startY=H/2-introCrawl.length*lineH/2 - introT*12; 
      introCrawl.forEach((line,i)=>{ const y=startY+i*lineH; if (y<-10||y>H+10) return; txtC(line,y,5,C.lightest); });
      if (introT>9.0 || jp.a || jp.start) { playSfx(880, 'square', 0.1); STATE='fight'; t=0; particles=[]; } 
    }

    let cutsceneT = 0;
    function updateCutscene(dt) {
      cutsceneT += dt; clr(C.darkest);
      for(let i=0; i<30; i++) {
         let px = (i * 23 + Math.sin(cutsceneT + i) * 10) % W;
         let py = (H + 20) - ((cutsceneT * 20 + i * 15) % (H + 40));
         fr(px, py, 2, 2, i%2===0 ? C.dark : C.light);
      }
      if (cutsceneT > 1 && cutsceneT < 5) {
         txtC('SEPHIROTH:', 80, 5, C.dark);
         if (cutsceneT > 2.0) txtC('I WILL...', 100, 6, C.light);
         if (cutsceneT > 3.0) txtC('NEVER BE A MEMORY.', 115, 6, C.lightest);
      } else if (cutsceneT > 6 && cutsceneT < 10) {
         txtC('CLOUD:', 80, 5, C.dark);
         if (cutsceneT > 7.0) txtC('STAY WHERE YOU BELONG...', 100, 5, C.light);
         if (cutsceneT > 8.5) txtC('IN MY MEMORIES.', 115, 6, C.lightest);
      } else if (cutsceneT >= 10) {
         STATE = 'victory'; victoryT = 0;
      }
    }

    let victoryT=0;
    function updateVictory(dt) {
      victoryT+=dt; t+=dt; clr(C.lightest);
      for (let i=0;i<20;i++) { const sx=((i*97+Math.floor(victoryT*30))%W+W)%W; const sy=((i*61+Math.floor(victoryT*15))%(H/2)+H/4); fr(sx,sy,3,3,i%2===0?C.dark:C.darkest); }
      fr(0,50,W,90,C.darkest); fr(2,52,W-4,86,C.dark); txtC('SEPHIROTH',70,6,C.light);
      txtC('DEFEATED!',84,8,C.lightest); fr(10,96,W-20,2,C.light); txtC('THE PLANET IS SAVED',110,4,C.light);
      const hx=W/2, hy=148; fr(hx-4,hy-20,8,3,C.darkest); fr(hx-3,hy-17,6,6,C.lightest);
      fr(hx-4,hy-11,8,9,C.dark); fr(hx+4,hy-18,3,22,C.darkest);
      if (Math.floor(victoryT*2)%2===0) txtC('A = PLAY AGAIN',190,4,C.darkest);
      if (jp.a || jp.start) { STATE='title'; victoryT=0; titleT=0; }
    }

    let goT=0;
    function updateGameOver(dt) {
      goT+=dt; t+=dt; fr(0,0,W,H,C.darkest);
      for (let i=0;i<5;i++) { ctx.globalAlpha=0.05+i*0.04; fr(0,i*40,W,40,C.dark); ctx.globalAlpha=1; }
      fr(0,60,W,80,C.darkest); fr(2,62,W-4,76,C.dark); txtC('YOU FELL...',76,6,C.lightest); txtC('SEPHIROTH',92,5,C.light); txtC('LAUGHS.',104,5,C.dark);
      for (let f=0;f<6;f++) { const fa=(0.4+f*0.28)+Math.sin(goT*1.5)*0.1; const fl=(24+f*8);
      ctx.save(); ctx.translate(W/2+3,150); ctx.rotate(fa); fr(0,0,3,fl,f%2===0?C.dark:C.light); ctx.restore(); }
      fr(W/2-5,125,10,8,C.lightest); fr(W/2-8,133,16,20,C.dark);
      if (Math.floor(goT*2)%2===0) txtC('A = TRY AGAIN',190,4,C.light);
      if (jp.a || jp.start) { STATE='title'; goT=0; titleT=0; }
    }

    let lastTime=0;
    let gameLoopStarted = false;
    function loop(ts) {
      const dt=Math.min((ts-lastTime)/1000,0.05); lastTime=ts; ctx.imageSmoothingEnabled=false;
      switch(STATE) {
        case 'title':      updateTitle(dt);      break;
        case 'difficulty': updateDifficulty(dt); break;
        case 'intro':      updateIntro(dt);      break;
        case 'fight':
        case 'phase2':     updateFight(dt);      break;
        case 'cutscene':   updateCutscene(dt);   break;
        case 'victory':    updateVictory(dt);    break;
        case 'gameover':   updateGameOver(dt);   break;
      }
      clearJP();
      requestAnimationFrame(loop);
    }

    function startRetroGame() {
      if (gameLoopStarted) return;
      gameLoopStarted = true;
      setupInput();
      requestAnimationFrame(ts => { lastTime=ts; requestAnimationFrame(loop); });
    }
  </script>
</body>
