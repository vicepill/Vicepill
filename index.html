<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Fullscreen</title>
  <style>
    body {
      margin: 0;
      background: black;
    }

    img {
      width: 100%;
      height: 100vh;
      object-fit: cover;
      display: block;
    }

    .spacer {
      height: 200vh;
    }
  </style>
</head>
<body>

  <img src="dancingmad.jpg" alt="">
  <div class="spacer"></div>

</body>
</html>
