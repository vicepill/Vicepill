<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Sync</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
    }

    img {
      width: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <audio id="audio" src="dancingmad.mp3" autoplay></audio>

  <img src="dancingmad.jpg" alt="">

  <script>
    const audio = document.getElementById("audio");

    function syncScroll() {
      if (!audio.duration) return;

      const progress = audio.currentTime / audio.duration;
      const maxScroll = document.body.scrollHeight - window.innerHeight;

      window.scrollTo(0, maxScroll * (1 - progress));
    }

    audio.addEventListener("timeupdate", syncScroll);

    audio.addEventListener("loadedmetadata", () => {
      window.scrollTo(0, document.body.scrollHeight);
    });
  </script>

</body>
</html>
