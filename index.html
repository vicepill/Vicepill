<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DM3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
img{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 2.5s ease-in-out;filter:brightness(.45) contrast(1.3) saturate(.5) sepia(.3) hue-rotate(180deg)}
img.on{opacity:1}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.9) 100%)}
button{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;background:none;border:1px solid #666;color:#999;padding:12px 32px;font:16px monospace;letter-spacing:6px;cursor:pointer}
button:hover{color:#fff;border-color:#fff}
</style>
</head>
<body>
<img id="a"><img id="b">
<div id="vignette"></div>
<audio id="audio" src="DM3.mp3" loop></audio>
<button id="start">ENTER</button>
<script>
let images=[];
const els=[a,b];
let i=-1,t=0;
function next(){
  i=(i+1)%images.length;
  const cur=els[t];
  t^=1;
  const nxt=els[t];
  nxt.onload=()=>{nxt.classList.add("on");cur.classList.remove("on")};
  nxt.src=images[i];
  setTimeout(next,10000+Math.random()*5000);
}
start.onclick=async()=>{
  start.remove();
  audio.play();
  const owner=location.hostname.split(".")[0];
  const repo=location.pathname.split("/")[1]||location.hostname;
  const files=await (await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`)).json();
  images=files.map(f=>f.name).filter(n=>/\.(jpe?g|png|gif|webp|avif|bmp|svg)$/i.test(n)).map(encodeURIComponent);
  if(images.length)next();
};
</script>
</body>
</html>
