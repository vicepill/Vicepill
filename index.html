<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>MAGITEK - Final Version</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* Rimosso lo scrolling visibile per un look full-screen */
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden; /* Nasconde la barra di scorrimento */
      height: 100%;
    }

    img {
      width: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* BOTTONE PIXEL ART */
    #magitekButton {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      font-size: 18px;
      font-family: 'Press Start 2P', cursive;
      color: #00ffcc;
      background-color: #000;
      cursor: pointer;
      z-index: 100;
      border: none;
      outline: none;

      /* Bordo Pixel Art Professionale */
      box-shadow: 
        -4px 0 0 0 #000,
        4px 0 0 0 #000,
        0 -4px 0 0 #000,
        0 4px 0 0 #000,
        -8px 0 0 0 #00ffcc,
        8px 0 0 0 #00ffcc,
        0 -8px 0 0 #00ffcc,
        0 8px 0 0 #00ffcc;
      
      transition: transform 0.1s;
    }

    #magitekButton:hover {
      color: #000;
      background-color: #00ffcc;
      box-shadow: 
        -4px 0 0 0 #000,
        4px 0 0 0 #000,
        0 -4px 0 0 #000,
        0 4px 0 0 #000,
        -8px 0 0 0 #fff,
        8px 0 0 0 #fff,
        0 -8px 0 0 #fff,
        0 8px 0 0 #fff;
    }

    #magitekButton:active {
      transform: translate(-50%, -45%);
    }
  </style>
</head>
<body>

  <button id="magitekButton">ENGAGE MAGITEK</button>

  <audio id="audio" src="dancingmad.mp3"></audio>
  <img id="mainImg" src="dancingmad.jpg" alt="Dancing Mad">

  <script>
    const audio = document.getElementById("audio");
    const btn = document.getElementById("magitekButton");
    const img = document.getElementById("mainImg");

    // Funzione per andare subito in fondo
    function scrollToBottom() {
      const scrollMax = document.documentElement.scrollHeight - window.innerHeight;
      window.scrollTo(0, scrollMax);
    }

    // Forza il posizionamento in fondo all'avvio
    // Usiamo sia load che un piccolo timeout per sicurezza con le immagini pesanti
    window.addEventListener('load', scrollToBottom);
    setTimeout(scrollToBottom, 100); 

    btn.onclick = async () => {
      btn.style.display = "none";

      try {
        await audio.play();
      } catch (e) {
        console.log("Audio play preventivo fallito");
      }

      // La risalita avviene qui
      audio.addEventListener("timeupdate", () => {
        if (!audio.duration) return;
        
        const progress = audio.currentTime / audio.duration;
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        
        // Risale verso lo 0 man mano che la musica avanza
        const targetScroll = maxScroll * (1 - progress);
        
        window.scrollTo(0, targetScroll);
      });
    };

    // Previene che l'utente scrolli a mano rompendo l'effetto
    window.onscroll = function() {
      if (btn.style.display !== "none") {
        // Se il bottone c'è ancora, rimaniamo in fondo
        const scrollMax = document.documentElement.scrollHeight - window.innerHeight;
        if (window.scrollY < scrollMax) {
          window.scrollTo(0, scrollMax);
        }
      }
    };
  </script>
</body>
</html>
