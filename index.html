<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGITEK</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --pixel-cyan: #00ffcc;
            --pixel-cyan-glow: #00ffcc88;
            --pixel-bg: #0a0a0a;
            --pixel-border-size: 8px;
            --pixel-step: 4px;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: #000000;
            overflow-y: scroll;
            overflow-x: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        html::-webkit-scrollbar {
            display: none;
        }

        body {
            min-height: 100vh;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        img {
            width: 100%;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 999;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.06) 2px,
                    rgba(0, 0, 0, 0.06) 4px);
            opacity: 0.5;
            animation: scanlineDrift 0.1s linear infinite;
        }

        @keyframes scanlineDrift {
            0% { background-position: 0 0; }
            100% { background-position: 0 4px; }
        }

        #magitekButton {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 220px;
            height: 56px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            font-size: 15px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--pixel-cyan);
            background: #0d0d0d;
            border: none;
            cursor: pointer;
            box-shadow: inset 3px 3px 0 rgba(0, 255, 204, 0.15), inset -3px -3px 0 rgba(0, 0, 0, 0.7);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transition: color 0.08s step-end, background 0.08s step-end, box-shadow 0.08s step-end, filter 0.08s step-end;
            user-select: none;
            -webkit-user-select: none;
        }

        #magitekButton::before {
            content: '';
            position: absolute;
            z-index: -1;
            width: calc(100% + var(--pixel-border-size) * 2);
            height: calc(100% + var(--pixel-border-size) * 2);
            top: calc(var(--pixel-border-size) * -1);
            left: calc(var(--pixel-border-size) * -1);
            background: var(--pixel-cyan);
            clip-path: polygon(0px 8px, 4px 4px, 8px 0px, 228px 0px, 232px 4px, 236px 8px, 236px 64px, 232px 68px, 228px 72px, 8px 72px, 4px 68px, 0px 64px);
            transition: background 0.08s step-end, filter 0.08s step-end;
        }

        #magitekButton::after {
            content: '';
            position: absolute;
            z-index: 2;
            pointer-events: none;
            width: 4px;
            height: 4px;
            background: #ffffff;
            opacity: 0.7;
            top: -10px;
            left: -10px;
            box-shadow: 230px 0px 0 0 #ffffff, 0px 66px 0 0 #ffffff, 230px 66px 0 0 #ffffff;
            transition: opacity 0.08s step-end;
        }

        #magitekButton:hover {
            color: #0d0d0d;
            background: var(--pixel-cyan);
            box-shadow: inset 3px 3px 0 rgba(255, 255, 255, 0.3), inset -3px -3px 0 rgba(0, 0, 0, 0.4), 0 0 18px var(--pixel-cyan), 0 0 40px var(--pixel-cyan-glow), 0 0 80px rgba(0, 255, 204, 0.25);
            filter: drop-shadow(0 0 10px var(--pixel-cyan));
        }

        #magitekButton:hover::before {
            background: #0d0d0d;
            filter: drop-shadow(0 0 6px var(--pixel-cyan));
        }

        #magitekButton:hover::after {
            opacity: 0;
        }

        #magitekButton:active {
            transform: translate(-50%, -50%) scale(0.96);
            box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.2), inset -1px -1px 0 rgba(0, 0, 0, 0.5), 0 0 8px var(--pixel-cyan);
            transition: transform 0.04s step-end, box-shadow 0.04s step-end;
        }

        @media (max-width: 480px) {
            #magitekButton {
                width: 170px;
                height: 44px;
                font-size: 11px;
                letter-spacing: 2px;
            }
            #magitekButton::before {
                width: calc(170px + var(--pixel-border-size) * 2);
                height: calc(44px + var(--pixel-border-size) * 2);
                clip-path: polygon(0px 8px, 4px 4px, 8px 0px, 178px 0px, 182px 4px, 186px 8px, 186px 52px, 182px 56px, 178px 60px, 8px 60px, 4px 56px, 0px 52px);
            }
            #magitekButton::after {
                top: -10px;
                left: -10px;
                box-shadow: 180px 0px 0 0 #ffffff, 0px 56px 0 0 #ffffff, 180px 56px 0 0 #ffffff;
            }
        }
    </style>
</head>
<body>

    <button id="magitekButton" title=" Premi per avviare ">MAGITEK</button>
    <audio id="audio" src="dancingmad.mp3" preload="auto"></audio>
    <img src="dancingmad.jpg" alt="Dancing Mad - Final Fantasy VI">

    <script>
        (function() {
            const audio = document.getElementById("audio");
            const btn = document.getElementById("magitekButton");

            const scrollToBottom = () => {
                const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
                window.scrollTo(0, maxScroll);
            };

            window.addEventListener('load', scrollToBottom);
            setTimeout(scrollToBottom, 100);

            btn.onclick = async () => {
                btn.textContent = '▶';
                btn.style.pointerEvents = 'none';
                btn.style.opacity = '0.7';

                try {
                    await audio.play();
                } catch (e) {
                    btn.textContent = 'MAGITEK';
                    btn.style.pointerEvents = 'auto';
                    btn.style.opacity = '1';
                    return;
                }

                btn.style.transition = 'opacity 0.3s step-end, transform 0.3s step-end';
                btn.style.opacity = '0';
                btn.style.transform = 'translate(-50%, -50%) scale(0.8)';
                
                setTimeout(() => {
                    btn.style.display = 'none';
                }, 350);

                audio.addEventListener("timeupdate", () => {
                    if (!audio.duration || audio.duration <= 0) return;
                    const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
                    const progress = audio.currentTime / audio.duration;
                    window.scrollTo(0, maxScroll * (1 - progress));
                });

                audio.addEventListener("ended", () => {
                    window.scrollTo(0, 0);
                    btn.style.display = 'flex';
                    btn.style.opacity = '1';
                    btn.style.transform = 'translate(-50%, -50%) scale(1)';
                    btn.style.pointerEvents = 'auto';
                    btn.textContent = 'MAGITEK';
                });
            };

            btn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    btn.click();
                }
            });
        })();
    </script>
</body>
</html>
