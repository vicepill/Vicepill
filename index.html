<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>MAGITEK</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
    }

    img {
      width: 100%;
      display: block;
    }

    #magitekButton {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 18px 34px;
      font-size: 20px;
      font-family: "Courier New", monospace;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #00ffcc;
      background: black;
      border: 2px solid #00ffcc;
      cursor: pointer;
      z-index: 10;
      box-shadow: 0 0 12px #00ffcc;
    }
  </style>
</head>
<body>

  <button id="magitekButton">MAGITEK</button>

  <audio id="audio" src="dancingmad.mp3"></audio>

  <img src="dancingmad.jpg" alt="">

  <script>
    const audio = document.getElementById("audio");
    const btn = document.getElementById("magitekButton");

    btn.onclick = async () => {
      btn.style.display = "none";

      try {
        await audio.play();
      } catch (e) {
        alert("Audio bloccato dal browser");
      }

      // INIZIO DAL BASSO
      window.scrollTo(0, document.body.scrollHeight);

      audio.addEventListener("timeupdate", () => {
        if (!audio.duration) return;

        const progress = audio.currentTime / audio.duration;
        const maxScroll = document.body.scrollHeight - window.innerHeight;

        // DAL BASSO → VERSO L'ALTO
        window.scrollTo(0, maxScroll * (1 - progress));
      });
    };
  </script>

</body>
</html>
