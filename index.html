<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>MAGITEK</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
    }
    img {
      width: 100%;
      display: block;
    }
    #magitekButton {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 18px 34px;
      font-size: 20px;
      font-family: "Courier New", monospace;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #00ffcc;
      background: black;
      border: none;
      cursor: pointer;
      z-index: 10;
      image-rendering: pixelated;
      /* Bordo pixeloso con box-shadow a scalini */
      box-shadow:
        /* bordo esterno */
        -4px -4px 0 0 #00ffcc,
         4px -4px 0 0 #00ffcc,
        -4px  4px 0 0 #00ffcc,
         4px  4px 0 0 #00ffcc,
        /* lati */
        -4px  0   0 0 #00ffcc,
         4px  0   0 0 #00ffcc,
         0   -4px 0 0 #00ffcc,
         0    4px 0 0 #00ffcc,
        /* glow */
        0 0 18px #00ffcc,
        0 0 40px #00ffcc44;
    }

    #magitekButton:hover {
      color: black;
      background: #00ffcc;
      box-shadow:
        -4px -4px 0 0 #00ffcc,
         4px -4px 0 0 #00ffcc,
        -4px  4px 0 0 #00ffcc,
         4px  4px 0 0 #00ffcc,
        -4px  0   0 0 #00ffcc,
         4px  0   0 0 #00ffcc,
         0   -4px 0 0 #00ffcc,
         0    4px 0 0 #00ffcc,
        0 0 24px #00ffcc,
        0 0 60px #00ffcc88;
    }
  </style>
</head>
<body>
  <button id="magitekButton">MAGITEK</button>
  <audio id="audio" src="dancingmad.mp3"></audio>
  <img src="dancingmad.jpg" alt="">
  <script>
    const audio = document.getElementById("audio");
    const btn = document.getElementById("magitekButton");

    // Parte dall'alto (in cima all'immagine) senza cliccare
    window.scrollTo(0, 0);

    btn.onclick = async () => {
      btn.style.display = "none";
      try {
        await audio.play();
      } catch (e) {
        alert("Audio bloccato dal browser");
      }

      // Scroll parte dal basso e risale
      window.scrollTo(0, document.body.scrollHeight);

      audio.addEventListener("timeupdate", () => {
        if (!audio.duration) return;
        const progress = audio.currentTime / audio.duration;
        const maxScroll = document.body.scrollHeight - window.innerHeight;
        window.scrollTo(0, maxScroll * (1 - progress));
      });
    };
  </script>
</body>
</html>
