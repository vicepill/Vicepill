<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>MAGITEK</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }
    #scroller {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    img {
      width: 100%;
      display: block;
    }
    #magitekButton {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 0;
    }
    #magitekButton svg {
      display: block;
      image-rendering: pixelated;
      filter:
        drop-shadow(0 0 6px rgba(255,255,255,0.6))
        drop-shadow(0 0 18px rgba(255,255,255,0.25))
        drop-shadow(0 0 40px rgba(180,180,255,0.15));
      transition: filter 0.15s;
    }
    #magitekButton:hover svg {
      filter:
        drop-shadow(0 0 10px rgba(255,255,255,0.95))
        drop-shadow(0 0 28px rgba(255,255,255,0.5))
        drop-shadow(0 0 60px rgba(180,180,255,0.35));
    }
    @keyframes flicker {
      0%,100% { opacity: 1; }
      92%      { opacity: 1; }
      93%      { opacity: 0.4; }
      94%      { opacity: 1; }
      97%      { opacity: 1; }
      98%      { opacity: 0.2; }
      99%      { opacity: 1; }
    }
    @keyframes cursor-blink {
      0%,49%   { opacity: 1; }
      50%,100% { opacity: 0; }
    }
    #btn-label {
      animation: flicker 4s infinite;
    }
    #btn-cursor {
      animation: cursor-blink 0.9s infinite;
    }
    #magitekButton::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.18) 3px,
        rgba(0,0,0,0.18) 4px
      );
      pointer-events: none;
      z-index: 1;
    }

    #infoButton {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 10;
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 0;
    }
    #infoButton svg {
      display: block;
      image-rendering: pixelated;
      filter:
        drop-shadow(0 0 4px rgba(255,255,255,0.5))
        drop-shadow(0 0 12px rgba(255,255,255,0.2));
      transition: filter 0.15s;
    }
    #infoButton:hover svg {
      filter:
        drop-shadow(0 0 8px rgba(255,255,255,0.95))
        drop-shadow(0 0 22px rgba(255,255,255,0.4));
    }

    #infoPanel {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: black;
      align-items: center;
      justify-content: center;
    }
    #infoPanel.open {
      display: flex;
    }
    #infoPanel p {
      font-family: 'Times New Roman', Times, serif;
      font-size: clamp(18px, 3vw, 28px);
      color: white;
      font-style: italic;
      letter-spacing: 0.04em;
      text-align: center;
      user-select: none;
    }
    #closeBtn {
      position: absolute;
      top: 20px;
      right: 24px;
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      font-family: 'Times New Roman', Times, serif;
      font-size: 28px;
      color: white;
      line-height: 1;
      opacity: 0.7;
      transition: opacity 0.15s;
    }
    #closeBtn:hover {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="scroller">
    <img src="dancingmad.jpg" alt="">
  </div>

  <button id="magitekButton" aria-label="MAGITEK">
    <svg
      width="240" height="80"
      viewBox="0 0 240 80"
      xmlns="http://www.w3.org/2000/svg"
      shape-rendering="crispEdges"
    >
      <rect x="8" y="8" width="224" height="64" fill="rgba(0,0,0,0.82)"/>
      <g fill="#cccccc">
        <rect x="16" y="0"   width="208" height="4"/>
        <rect x="16" y="76"  width="208" height="4"/>
        <rect x="0"  y="16"  width="4"   height="48"/>
        <rect x="236" y="16" width="4"   height="48"/>
        <rect x="8"  y="0"   width="8"   height="4"/>
        <rect x="0"  y="8"   width="4"   height="8"/>
        <rect x="4"  y="4"   width="4"   height="4"/>
        <rect x="224" y="0"  width="8"   height="4"/>
        <rect x="236" y="8"  width="4"   height="8"/>
        <rect x="232" y="4"  width="4"   height="4"/>
        <rect x="8"  y="76"  width="8"   height="4"/>
        <rect x="0"  y="64"  width="4"   height="8"/>
        <rect x="4"  y="72"  width="4"   height="4"/>
        <rect x="224" y="76" width="8"   height="4"/>
        <rect x="236" y="64" width="4"   height="8"/>
        <rect x="232" y="72" width="4"   height="4"/>
      </g>
      <g fill="#444444">
        <rect x="8"   y="8"  width="224" height="2"/>
        <rect x="8"   y="70" width="224" height="2"/>
        <rect x="8"   y="8"  width="2"   height="64"/>
        <rect x="230" y="8"  width="2"   height="64"/>
      </g>
      <g fill="#eeeeee" opacity="0.15">
        <rect x="10" y="10" width="220" height="1"/>
        <rect x="10" y="10" width="1"   height="60"/>
      </g>
      <g fill="#888888">
        <rect x="12"  y="12" width="4" height="4"/>
        <rect x="224" y="12" width="4" height="4"/>
        <rect x="12"  y="64" width="4" height="4"/>
        <rect x="224" y="64" width="4" height="4"/>
      </g>
      <g fill="#666666">
        <rect x="108" y="2"  width="24" height="2"/>
        <rect x="108" y="76" width="24" height="2"/>
      </g>
      <g id="btn-label">
        <text
          x="120" y="46"
          text-anchor="middle"
          dominant-baseline="middle"
          font-family="'Courier New', monospace"
          font-size="18"
          letter-spacing="8"
          fill="#ffffff"
          font-weight="bold"
        >MAGITEK</text>
      </g>
      <rect id="btn-cursor" x="208" y="33" width="4" height="14" fill="#ffffff" opacity="0.7"/>
      <g fill="#aaaaaa">
        <rect x="18" y="36" width="4" height="4"/>
        <rect x="22" y="32" width="4" height="4"/>
        <rect x="22" y="40" width="4" height="4"/>
        <rect x="26" y="28" width="4" height="4"/>
        <rect x="26" y="44" width="4" height="4"/>
      </g>
    </svg>
  </button>

  <button id="infoButton" aria-label="Info">
    <svg
      width="40" height="40"
      viewBox="0 0 40 40"
      xmlns="http://www.w3.org/2000/svg"
      shape-rendering="crispEdges"
    >
      <rect x="4" y="4" width="32" height="32" fill="rgba(0,0,0,0.82)"/>
      <g fill="#cccccc">
        <rect x="8"  y="0"  width="24" height="4"/>
        <rect x="8"  y="36" width="24" height="4"/>
        <rect x="0"  y="8"  width="4"  height="24"/>
        <rect x="36" y="8"  width="4"  height="24"/>
        <rect x="4"  y="4"  width="4"  height="4"/>
        <rect x="32" y="4"  width="4"  height="4"/>
        <rect x="4"  y="32" width="4"  height="4"/>
        <rect x="32" y="32" width="4"  height="4"/>
      </g>
      <g fill="#444444">
        <rect x="4"  y="4"  width="32" height="2"/>
        <rect x="4"  y="34" width="32" height="2"/>
        <rect x="4"  y="4"  width="2"  height="32"/>
        <rect x="34" y="4"  width="2"  height="32"/>
      </g>
      <text
        x="20" y="22"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="'Times New Roman', serif"
        font-size="18"
        fill="#ffffff"
        font-style="italic"
      >i</text>
    </svg>
  </button>

  <div id="infoPanel">
    <button id="closeBtn">&#x2715;</button>
    <p>da mihi mortem iterum</p>
  </div>

  <audio id="audio" src="dancingmad.mp3"></audio>

  <script>
    const audio    = document.getElementById("audio");
    const btn      = document.getElementById("magitekButton");
    const scroller = document.getElementById("scroller");
    const infoBtn  = document.getElementById("infoButton");
    const infoPanel = document.getElementById("infoPanel");
    const closeBtn = document.getElementById("closeBtn");

    scroller.scrollTop = 0;

    btn.onclick = async () => {
      btn.style.display = "none";
      try { await audio.play(); }
      catch (e) { alert("Audio bloccato dal browser"); }
      const maxScroll = scroller.scrollHeight - scroller.clientHeight;
      scroller.scrollTop = maxScroll;
      audio.addEventListener("timeupdate", () => {
        if (!audio.duration) return;
        const progress = audio.currentTime / audio.duration;
        scroller.scrollTop = maxScroll * (1 - progress);
      });
    };

    infoBtn.onclick = () => infoPanel.classList.add("open");
    closeBtn.onclick = () => infoPanel.classList.remove("open");
  </script>
</body>
</html>
