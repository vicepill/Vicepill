<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magitek</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: black; overflow: hidden; }
  #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: black; }
  #magitekButton {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20;
    background: transparent; border: none; outline: none; cursor: pointer; padding: 0;
  }
  #magitekButton svg {
    display: block; image-rendering: pixelated;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.6)) drop-shadow(0 0 18px rgba(255,255,255,0.25));
    transition: filter 0.15s;
  }
  #magitekButton:hover svg {
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.95)) drop-shadow(0 0 28px rgba(255,255,255,0.5));
  }
</style>
</head>
<body>

  <video id="video" src="ffv1.mp4" muted playsinline preload="auto"></video>
  <audio id="audio" src="dancingmad.mp3" preload="auto"></audio>

  <!-- Needed because browsers block audio until the user interacts with the page -->
  <button id="magitekButton" aria-label="MAGITEK">
    <svg width="240" height="80" viewBox="0 0 240 80" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
      <rect x="8" y="8" width="224" height="64" fill="rgba(0,0,0,0.82)"/>
      <g fill="#cccccc">
        <rect x="16" y="0" width="208" height="4"/><rect x="16" y="76" width="208" height="4"/>
        <rect x="0" y="16" width="4" height="48"/><rect x="236" y="16" width="4" height="48"/>
        <rect x="8" y="0" width="8" height="4"/><rect x="0" y="8" width="4" height="8"/>
        <rect x="4" y="4" width="4" height="4"/><rect x="224" y="0" width="8" height="4"/>
        <rect x="236" y="8" width="4" height="8"/><rect x="232" y="4" width="4" height="4"/>
        <rect x="8" y="76" width="8" height="4"/><rect x="0" y="64" width="4" height="8"/>
        <rect x="4" y="72" width="4" height="4"/><rect x="224" y="76" width="8" height="4"/>
        <rect x="236" y="64" width="4" height="8"/><rect x="232" y="72" width="4" height="4"/>
      </g>
      <g fill="#444444">
        <rect x="8" y="8" width="224" height="2"/><rect x="8" y="70" width="224" height="2"/>
        <rect x="8" y="8" width="2" height="64"/><rect x="230" y="8" width="2" height="64"/>
      </g>
      <text x="120" y="46" text-anchor="middle" dominant-baseline="middle" font-family="'Courier New', monospace" font-size="18" letter-spacing="8" fill="#ffffff" font-weight="bold">MAGITEK</text>
    </svg>
  </button>

  <script>
    (function () {
      const video = document.getElementById('video');
      const audio = document.getElementById('audio');
      const btn = document.getElementById('magitekButton');
      const MAX_DRIFT = 0.12; // seconds

      video.muted = true; // video never plays sound

      // Audio is the master clock; the video follows it.
      function sync() {
        if (!audio.paused && !audio.ended) {
          if (Math.abs(video.currentTime - audio.currentTime) > MAX_DRIFT) {
            video.currentTime = audio.currentTime;
          }
        }
        requestAnimationFrame(sync);
      }

      audio.addEventListener('pause', () => video.pause());
      audio.addEventListener('play', () => { video.currentTime = audio.currentTime; video.play().catch(() => {}); });
      audio.addEventListener('seeking', () => { video.currentTime = audio.currentTime; });
      audio.addEventListener('ended', () => video.pause());
      video.addEventListener('error', () => {
        console.error('Video error:', video.error);
        alert('The browser cannot play ffv1.mp4 (FFV1 codec is not supported by browsers). Re-encode it to H.264 - see instructions.');
      });
      audio.addEventListener('error', () => {
        console.error('Audio error:', audio.error);
        alert('Could not load dancingmad.mp3 - check that it is in the same folder and that you opened the page via a local server.');
      });

      btn.onclick = async () => {
        btn.style.display = 'none';
        video.currentTime = 0;
        audio.currentTime = 0;
        try { await audio.play(); } catch (e) { console.error('Audio play failed:', e); }
        try { await video.play(); } catch (e) { console.error('Video play failed:', e); }
        requestAnimationFrame(sync);
      };
    })();
  </script>
</body>
</html>
