<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>MAGITEK - Pixel Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      /* Impedisce lo scroll manuale prima del click se preferisci */
      overflow-x: hidden; 
    }

    img {
      width: 100%;
      display: block;
      image-rendering: pixelated; /* Mantiene l'immagine nitida se è pixel art */
    }

    /* IL BOTTONE PIXEL ART */
    #magitekButton {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      font-size: 16px;
      font-family: 'Press Start 2P', cursive;
      color: #00ffcc;
      background-color: #000;
      cursor: pointer;
      z-index: 100;
      border: none;
      outline: none;

      /* Effetto bordo a pixel (Double-Step) */
      box-shadow: 
        /* Bordo Interno */
        -4px 0 0 0 #000,
        4px 0 0 0 #000,
        0 -4px 0 0 #000,
        0 4px 0 0 #000,
        /* Bordo Esterno Colorato */
        -8px 0 0 0 #00ffcc,
        8px 0 0 0 #00ffcc,
        0 -8px 0 0 #00ffcc,
        0 8px 0 0 #00ffcc;
      
      transition: all 0.1s;
    }

    #magitekButton:hover {
      color: #000;
      background-color: #00ffcc;
      box-shadow: 
        -4px 0 0 0 #000,
        4px 0 0 0 #000,
        0 -4px 0 0 #000,
        0 4px 0 0 #000,
        -8px 0 0 0 #fff, /* Cambia colore al passaggio */
        8px 0 0 0 #fff,
        0 -8px 0 0 #fff,
        0 8px 0 0 #fff,
        0 0 20px #00ffcc; /* Glow */
    }

    #magitekButton:active {
      transform: translate(-50%, -46%); /* Simula la pressione */
    }

  </style>
</head>
<body>

  <button id="magitekButton">START MAGITEK</button>

  <audio id="audio" src="dancingmad.mp3"></audio>
  
  <img src="dancingmad.jpg" alt="Dancing Mad Artwork">

  <script>
    const audio = document.getElementById("audio");
    const btn = document.getElementById("magitekButton");

    // 1. Assicura che la pagina sia in cima al caricamento
    window.onload = () => {
        window.scrollTo(0, 0);
    };

    btn.onclick = async () => {
      // Nasconde il bottone
      btn.style.display = "none";

      try {
        await audio.play();
      } catch (e) {
        console.error("Interazione richiesta per l'audio");
      }

      // 2. Calcolo dello scroll: portiamo subito in fondo
      const totalHeight = document.body.scrollHeight;
      const viewportHeight = window.innerHeight;
      const maxScroll = totalHeight - viewportHeight;

      window.scrollTo(0, maxScroll);

      // 3. Risalita dinamica basata sul tempo della musica
      audio.addEventListener("timeupdate", () => {
        if (!audio.duration) return;
        
        const progress = audio.currentTime / audio.duration;
        // Formula per risalire: maxScroll -> 0
        const currentScroll = maxScroll * (1 - progress);
        
        window.scrollTo({
          top: currentScroll,
          behavior: 'auto' // 'smooth' potrebbe laggare con timeupdate frequenti
        });
      });
    };
  </script>
</body>
</html>
