<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magitek</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: black; overflow: hidden; font-family: sans-serif;
  }

  #magitek-container {
    position: absolute; inset: 0; width: 100%; height: 100%; z-index: 10;
  }
  #scroller { width: 100%; height: 100%; overflow: hidden; }
  #scroller img { width: 100%; display: block; }
  #vignette {
    position: fixed; inset: 0; z-index: 15; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.92) 80%, rgba(0,0,0,1) 100%);
    opacity: 1; transition: opacity 0.08s linear;
  }
  
  #magitekButton {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20;
    background: transparent; border: none; outline: none; cursor: pointer; padding: 0;
  }
  #magitekButton svg {
    display: block; image-rendering: pixelated;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.6)) drop-shadow(0 0 18px rgba(255,255,255,0.25)) drop-shadow(0 0 40px rgba(180,180,255,0.15));
    transition: filter 0.15s;
  }
  #magitekButton:hover svg {
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.95)) drop-shadow(0 0 28px rgba(255,255,255,0.5)) drop-shadow(0 0 60px rgba(180,180,255,0.35));
  }
  #magitekButton::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: repeating-linear-gradient(to bottom, transparent 0px, transparent 3px, rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px);
  }

  @keyframes flicker {
    0%,100% { opacity: 1; } 92% { opacity: 1; } 
    93% { opacity: 0.4; } 94% { opacity: 1; } 
    97% { opacity: 1; } 98% { opacity: 0.2; } 
    99% { opacity: 1; }
  }
  @keyframes cursor-blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  #btn-label { animation: flicker 4s infinite; }
  #btn-cursor { animation: cursor-blink 0.9s infinite; }

  :root {
    --gb-lightest: #9bbc0f; --gb-light: #8bac0f; --gb-dark: #306230; --gb-darkest: #0f380f;
    --btn-ab: #c44040; --btn-ab-sh: #8a1c1c;
    --body-color: #b0a090; --body-dark: #8a7a6a; --body-shadow: #6a5a4a; 
  }

  #game-container {
    display: none; width: 100%; height: 100%;
    position: absolute; inset: 0; z-index: 40;
    justify-content: center; align-items: center; background: #0a0a14;
    font-family: 'Press Start 2P', monospace;
  }
  #game-container::before { content:''; position:fixed; inset:0; background: radial-gradient(ellipse at 50% 0%, #1a0a2e 0%, #0a0a14 60%); z-index:-1; }
  #game-container::after { content:''; position:fixed; inset:0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px); pointer-events:none; z-index:9999; }

  .console-device {
    width: 300px; background: linear-gradient(170deg, var(--body-color) 0%, #9a8a78 50%, var(--body-dark) 100%);
    border-radius: 18px 18px 60px 60px;
    box-shadow: 0 4px 0 var(--body-shadow), 0 8px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.3), 0 0 0 2px #3a3a5e;
    display:flex;
    flex-direction:column; align-items:center; padding: 12px 16px 20px; position:relative; flex-shrink:0;
  }
  .console-label { font-size: 5px; color: var(--body-shadow); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 6px; }
  .power-led {
    position:absolute; top:16px; right:20px; width:6px; height:6px; background:#00ff44; border-radius:50%;
    box-shadow: 0 0 6px #00ff44, 0 0 12px #00ff44; animation: led-pulse 2s infinite;
  }
  @keyframes led-pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .screen-bezel {
    width: 232px; background: #1a1a1a; border-radius: 8px; padding: 12px;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.8), 0 2px 4px rgba(0,0,0,0.5); position:relative; margin-bottom:8px;
  }
  .screen-bezel::before {
    content:'ONE WINGED ANGEL EDITION'; position:absolute; top:4px; left:50%; transform:translateX(-50%);
    font-family:'Press Start 2P',monospace; font-size:3.5px; color:#444; letter-spacing:1px; white-space:nowrap;
  }
  .screen-inner {
    width:208px; height:208px; background:var(--gb-lightest); border:3px solid var(--gb-darkest);
    position:relative; overflow:hidden; image-rendering:pixelated;
    box-shadow: inset 0 0 20px rgba(0,56,0,0.3), inset 0 0 4px rgba(0,0,0,0.4);
  }
  .screen-inner::after {
    content:''; position:absolute; inset:0;
    background-image: linear-gradient(rgba(0,0,0,0.03) 1px,transparent 1px), linear-gradient(90deg,rgba(0,0,0,0.03) 1px,transparent 1px);
    background-size:2px 2px; pointer-events:none; z-index:10;
  }
  #gameCanvas { width:202px; height:202px; display:block; image-rendering:pixelated; }

  .console-side-deco { display:flex; justify-content:space-between; width:100%; margin-bottom:4px; }
  .vol-label { font-family:'VT323',monospace; font-size:10px; color:var(--body-shadow); }

  .controls-row { display:flex; justify-content:space-between; align-items:center; width:100%; margin-top:4px; gap:8px; }
  .dpad { width:90px; height:90px; position:relative; flex-shrink:0; }
  .dpad-center {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:30px; height:30px;
    background:linear-gradient(135deg,#555,#333); border-radius:50%; z-index:2;
  }
  .dpad-arm {
    position:absolute; background:linear-gradient(160deg,#555,#333); border-radius:3px; cursor:pointer; user-select:none;
    box-shadow:0 3px 0 #1a1a1a,0 4px 6px rgba(0,0,0,0.4); display:flex; align-items:center; justify-content:center;
    font-size:8px; color:#888; transition:transform 0.05s,box-shadow 0.05s;
  }
  .dpad-arm:active,.dpad-arm.pressed { background:linear-gradient(160deg,#444,#222); transform:translateY(1px)!important; box-shadow:0 1px 0 #1a1a1a!important; }
  .dpad-up    { width:30px;height:30px;top:0;left:30px;border-radius:4px 4px 2px 2px; }
  .dpad-down  { width:30px;height:30px;bottom:0;left:30px;border-radius:2px 2px 4px 4px; }
  .dpad-left  { width:30px;height:30px;top:30px;left:0;border-radius:4px 2px 2px 4px; }
  .dpad-right { width:30px;height:30px;top:30px;right:0;border-radius:2px 4px 4px 2px; }
  .dpad-up::after{content:'▲'} .dpad-down::after{content:'▼'} .dpad-left::after{content:'◀'} .dpad-right::after{content:'▶'}

  .btn-cluster { width:90px; height:90px; position:relative; flex-shrink:0; }
  .btn-action {
    position:absolute; width:28px; height:28px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#d45050,var(--btn-ab));
    box-shadow:0 4px 0 var(--btn-ab-sh),0 5px 10px rgba(0,0,0,0.4);
    cursor:pointer; user-select:none; display:flex; align-items:center; justify-content:center;
    font-family:'Press Start 2P',monospace; font-size:7px; color:rgba(255,255,255,0.9);
    text-shadow:0 1px 2px rgba(0,0,0,0.5); transition:transform 0.05s,box-shadow 0.05s; border:none; outline:none;
  }
  .btn-action:active,.btn-action.pressed { transform:translateY(3px)!important; box-shadow:0 1px 0 var(--btn-ab-sh),0 2px 4px rgba(0,0,0,0.4)!important; }
  .btn-y{top:0;left:31px} .btn-x{top:31px;left:0} .btn-a{top:31px;right:0} .btn-b{bottom:0;left:31px}

  .select-start-row { display:flex; gap:16px; margin-top:8px; }
  .btn-pill {
    width:50px; height:14px; border-radius:7px; background:linear-gradient(180deg,#555,#333);
    box-shadow:0 3px 0 #1a1a1a,0 4px 6px rgba(0,0,0,0.4); cursor:pointer; user-select:none;
    display:flex; align-items:center; justify-content:center; font-family:'Press Start 2P',monospace; font-size:4px; color:#888;
    transition:transform 0.05s,box-shadow 0.05s; transform:rotate(-10deg);
  }
  .btn-pill:active,.btn-pill.pressed { transform:rotate(-10deg) translateY(2px); box-shadow:0 1px 0 #1a1a1a; }
  .speaker-grille { display:flex; gap:3px; margin-top:6px; }
  .speaker-dot { width:3px; height:3px; background:var(--body-shadow); border-radius:50%; opacity:0.6; }
</style>
</head>
<body>

  <audio id="_a1" src="dancingmad.mp3"></audio>
  <audio id="_a2" src="owa.mp3" loop></audio>

  <div id="magitek-container">
    <div id="scroller"><img src="dancingmad.jpg" alt=""></div>
    <div id="vignette"></div>

    <button id="magitekButton" aria-label="MAGITEK">
      <svg width="240" height="80" viewBox="0 0 240 80" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
        <rect x="8" y="8" width="224" height="64" fill="rgba(0,0,0,0.82)"/>
        <g fill="#cccccc">
          <rect x="16" y="0"   width="208" height="4"/><rect x="16" y="76"  width="208" height="4"/>
          <rect x="0"  y="16"  width="4"   height="48"/><rect x="236" y="16" width="4"   height="48"/>
          <rect x="8"  y="0"   width="8"   height="4"/><rect x="0"  y="8"   width="4"   height="8"/>
          <rect x="4"  y="4"   width="4"   height="4"/><rect x="224" y="0"  width="8"   height="4"/>
          <rect x="236" y="8"  width="4"   height="8"/><rect x="232" y="4"  width="4"   height="4"/>
          <rect x="8"  y="76"  width="8"   height="4"/><rect x="0"  y="64"  width="4"   height="8"/>
          <rect x="4"  y="72"  width="4"   height="4"/><rect x="224" y="76" width="8"   height="4"/>
          <rect x="236" y="64" width="4"   height="8"/><rect x="232" y="72" width="4"   height="4"/>
        </g>
        <g fill="#444444">
          <rect x="8" y="8" width="224" height="2"/><rect x="8" y="70" width="224" height="2"/>
          <rect x="8" y="8" width="2" height="64"/><rect x="230" y="8" width="2" height="64"/>
        </g>
        <g fill="#eeeeee" opacity="0.15">
          <rect x="10" y="10" width="220" height="1"/><rect x="10" y="10" width="1" height="60"/>
        </g>
        <g fill="#888888">
          <rect x="12" y="12" width="4" height="4"/><rect x="224" y="12" width="4" height="4"/>
          <rect x="12" y="64" width="4" height="4"/><rect x="224" y="64" width="4" height="4"/>
        </g>
        <g fill="#666666">
          <rect x="108" y="2" width="24" height="2"/><rect x="108" y="76" width="24" height="2"/>
        </g>
        <g id="btn-label">
          <text x="120" y="46" text-anchor="middle" dominant-baseline="middle" font-family="'Courier New', monospace" font-size="18" letter-spacing="8" fill="#ffffff" font-weight="bold">MAGITEK</text>
        </g>
        <rect id="btn-cursor" x="208" y="33" width="4" height="14" fill="#ffffff" opacity="0.7"/>
        <g fill="#aaaaaa">
          <rect x="18" y="36" width="4" height="4"/><rect x="22" y="32" width="4" height="4"/>
          <rect x="22" y="40" width="4" height="4"/><rect x="26" y="28" width="4" height="4"/>
          <rect x="26" y="44" width="4" height="4"/>
        </g>
      </svg>
    </button>
  </div>

  <div id="game-container">
    <div class="console-device">
      <div class="console-label">RetroPocket — One Winged Angel</div>
      <div class="power-led"></div>
      <div class="screen-bezel">
        <div class="screen-inner">
          <canvas id="gameCanvas" width="202" height="202"></canvas>
        </div>
      </div>
      <div class="console-side-deco">
        <span class="vol-label">◁ VOL ▷</span>
        <span class="vol-label">CONTRAST</span>
      </div>
      <div class="controls-row">
        <div class="dpad">
          <div class="dpad-arm dpad-up" id="btn-up"></div>
          <div class="dpad-arm dpad-down" id="btn-down"></div>
          <div class="dpad-arm dpad-left" id="btn-left"></div>
          <div class="dpad-arm dpad-right" id="btn-right"></div>
          <div class="dpad-center"></div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
          <div class="select-start-row">
            <div class="btn-pill" id="btn-select">SELECT</div>
            <div class="btn-pill" id="btn-start">START</div>
          </div>
          <div class="speaker-grille">
            <div class="speaker-dot"></div><div class="speaker-dot"></div>
            <div class="speaker-dot"></div><div class="speaker-dot"></div>
            <div class="speaker-dot"></div><div class="speaker-dot"></div>
            <div class="speaker-dot"></div><div class="speaker-dot"></div>
          </div>
        </div>
        <div class="btn-cluster">
          <div class="btn-action btn-y" id="btn-y">Y</div>
          <div class="btn-action btn-x" id="btn-x">X</div>
          <div class="btn-action btn-a" id="btn-a">A</div>
          <div class="btn-action btn-b" id="btn-b">B</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const $ = id => document.getElementById(id);
      const _a1 = $('_a1'), _a2 = $('_a2'), _mb = $('magitekButton'), _sc = $('scroller'), _vg = $('vignette');
      const _T1 = 1080, _S1 = 650, _F1 = _T1;
      _sc.scrollTop = 0;

      let _dl = 1, _ds = 1;
      const _DN = ['EASY', 'NORMAL', 'HARD', 'EXTREME'];
      let _dt = 0;
      let _dm = { hp: 1, dmg: 1, spd: 1 };
      let _bm1 = 350, _bm2 = 500;
      let _shk = 0;
      
      function _uV(t) {
        let o;
        if (t <= _S1) {
          o = 1 - ((t / _S1) * 0.35);
        } else {
          let e = 1 - Math.pow(1 - ((t - _S1) / (_F1 - _S1)), 2);
          o = 0.65 - (e * 0.65);
        }
        _vg.style.opacity = Math.max(0, o);
      }

      _mb.onclick = async () => {
        _mb.style.display = "none";
        try { await _a1.play(); } catch (e) { }
        
        setTimeout(async () => {
          _a1.pause();
          try { 
            _a2.volume = 0.6;
            await _a2.play();
          } catch (e) {}

          $('magitek-container').style.display = 'none';
          $('game-container').style.display = 'flex';
          _initApp();
        }, 3000);

        const mX = _sc.scrollHeight - _sc.clientHeight;
        _sc.scrollTop = mX;
        _a1.addEventListener("timeupdate", () => {
          if (!_a1.duration) return;
          let p = _a1.currentTime / _a1.duration;
          _sc.scrollTop = mX * (1 - p);
          _uV(_a1.currentTime);
        });
      };

      const cvs = $('gameCanvas');
      const ctx = cvs.getContext('2d');
      const W = 202, H = 202;
      const C = { lightest: '#9bbc0f', light: '#8bac0f', dark: '#306230', darkest: '#0f380f' };
      const AC = window.AudioContext || window.webkitAudioContext;
      let _ac;
      
      function _snd(f, t, d, v=0.1) {
        if (!_ac) _ac = new AC();
        if (_ac.state === 'suspended') _ac.resume();
        let o = _ac.createOscillator(), g = _ac.createGain();
        o.type = t;
        o.frequency.setValueAtTime(f, _ac.currentTime);
        o.frequency.exponentialRampToValueAtTime(f * 0.1, _ac.currentTime + d);
        g.gain.setValueAtTime(v, _ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, _ac.currentTime + d);
        o.connect(g); g.connect(_ac.destination);
        o.start(); o.stop(_ac.currentTime + d);
      }
      
      function _sndH() {
        if (!_ac) _ac = new AC();
        if (_ac.state === 'suspended') _ac.resume();
        let o = _ac.createOscillator(), g = _ac.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(400, _ac.currentTime);
        o.frequency.exponentialRampToValueAtTime(1400, _ac.currentTime + 0.4);
        g.gain.setValueAtTime(0.3, _ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, _ac.currentTime + 0.4);
        o.connect(g); g.connect(_ac.destination);
        o.start(); o.stop(_ac.currentTime + 0.4);
      }

      const K = {}, JP = {};
      function _inp() {
        const m = [
          ['btn-up','up'],['btn-down','down'],['btn-left','left'],['btn-right','right'],
          ['btn-a','a'],['btn-b','b'],['btn-x','x'],['btn-y','y'],
          ['btn-select','select'],['btn-start','start'],
        ];
        m.forEach(([i, k]) => {
          let e = $(i);
          e.addEventListener('pointerdown', x => { x.preventDefault(); K[k] = true; JP[k] = true; e.classList.add('pressed'); });
          e.addEventListener('pointerup', x => { x.preventDefault(); K[k] = false; e.classList.remove('pressed'); });
          e.addEventListener('pointerleave', x => { K[k] = false; e.classList.remove('pressed'); });
        });
        document.addEventListener('keydown', e => {
          let km = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',z:'a',x:'b',c:'y',y:'y',v:'x',' ':'a',Enter:'start',Shift:'select'};
          let k = km[e.key] || km[e.key?.toLowerCase()];
          if (k) { K[k] = true; JP[k] = true; }
        });
        document.addEventListener('keyup', e => {
          let km = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',z:'a',x:'b',c:'y',y:'y',v:'x',' ':'a',Enter:'start',Shift:'select'};
          let k = km[e.key] || km[e.key?.toLowerCase()];
          if (k) K[k] = false;
        });
      }

      function _clrJP() { Object.keys(JP).forEach(k => JP[k] = false); }

      const _r = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
      const _bg = (c = C.lightest) => _r(0, 0, W, H, c);
      function _tx(s, x, y, sz = 6, col = C.darkest, font = 'Press Start 2P') { ctx.font = `${sz}px "${font}"`; ctx.fillStyle = col; ctx.fillText(s, x, y); }
      function _txC(s, y, sz = 6, col = C.darkest) { ctx.font = `${sz}px "Press Start 2P"`; ctx.fillStyle = col; ctx.fillText(s, (W - ctx.measureText(s).width) / 2, y); }

      let ST = 'title', _t = 0, _fN = 0;
      let _pt = [];
      function _spP(x, y, n, col, spd = 60, lf = 0.5) {
        for (let i = 0; i < n; i++) {
          let a = Math.random() * Math.PI * 2, s = spd * (0.5 + Math.random());
          _pt.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, col, life: lf, maxLife: lf, size: Math.floor(Math.random() * 3) + 1 });
        }
      }
      function _upP(dt) {
        _pt = _pt.filter(p => {
          p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 80 * dt; p.life -= dt;
          ctx.globalAlpha = p.life / p.maxLife; _r(p.x, p.y, p.size, p.size, p.col); ctx.globalAlpha = 1;
          return p.life > 0;
        });
      }

      let _flT = 0, _flC = C.lightest;
      function _flsh(c, dur = 0.15) { _flT = dur; _flC = c; }

      const HRO = {
        x: W / 2, y: H - 28, w: 10, h: 16, hp: 150, maxHp: 150, mp: 100, maxMp: 100, speed: 110,
        attacking: false, attackTimer: 0, attackCooldown: 0, invincible: false, invTimer: 0,
        slashTrail: [], limitBreak: false, limitGauge: 0, dead: false,
        slashFx: { active: false, timer: 0 }, healsLeft: 2
      };
      
      function _drHRO() {
        const { x, y, invincible, attacking } = HRO;
        if (invincible && Math.floor(_t * 20) % 2 === 0) return;
        
        let bounce = attacking ? 0 : Math.sin(_t * 10) * 1.5;
        let hy = y + bounce;

        ctx.save();
        ctx.translate(x, hy - 10);
        if (attacking) {
           let pr = 1 - (HRO.attackTimer / 0.3);
           ctx.rotate(-Math.PI / 4 + pr * Math.PI);
           _r(0, -20, 4, 25, C.lightest);
           _r(-2, -5, 8, 2, C.darkest);
        } else {
           ctx.rotate(-Math.PI / 6);
           _r(-2, -15, 5, 20, C.dark);
           _r(-3, -15, 2, 20, C.light);
           _r(-4, -2, 10, 2, C.darkest);
        }
        ctx.restore();
        let bd = attacking ? C.lightest : C.dark;
        _r(x - 4, hy - 16, 8, 3, C.darkest); _r(x - 2, hy - 19, 4, 3, C.darkest);
        _r(x - 5, hy - 17, 2, 2, C.darkest); _r(x + 3, hy - 17, 2, 2, C.darkest);
        _r(x - 6, hy - 15, 2, 2, C.darkest); _r(x + 4, hy - 15, 2, 2, C.darkest);
        _r(x - 3, hy - 13, 6, 6, C.lightest); _r(x - 2, hy - 11, 2, 2, C.darkest);
        _r(x + 0, hy - 11, 2, 2, C.darkest); _r(x - 3, hy - 7, 8, 9, bd);
        _r(x - 5, hy - 6, 2, 7, C.dark); _r(x + 3, hy - 6, 2, 7, C.dark);
        _r(x - 3, hy + 2, 3, 6, C.darkest); _r(x + 0, hy + 2, 3, 6, C.darkest);

        if (attacking) {
          HRO.slashTrail.forEach(s => { ctx.globalAlpha = s.a; _r(s.x, s.y, s.w, s.h, C.lightest); ctx.globalAlpha = 1; });
